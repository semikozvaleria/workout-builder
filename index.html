<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crea Scheda Palestra</title>
  <!-- Script html2pdf per scaricare il PDF direttamente dal browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Database esterno degli esercizi -->
  <script src="esercizi.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    .container { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .site-logo { height: 38px; width: auto; max-width: 110px; object-fit: contain; border-radius: 6px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: var(--primary); display: flex; justify-content: space-between; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    input, select, textarea { background: #070d17; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
    input:focus, select:focus { border-color: var(--primary); }

    /* Selettore Esercizio */
    .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .preview-box { display: flex; gap: 12px; align-items: center; margin: 8px 0; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 8px; }
    .preview-thumb { width: 68px; height: 68px; border-radius: 6px; object-fit: cover; background: #000; border: 1px solid var(--border); }
    .preview-info { font-size: 0.85rem; line-height: 1.3; }

    .btn { border: none; border-radius: 8px; padding: 12px 14px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
    .btn:active { transform: scale(0.98); }
    .btn-add { background: var(--primary); color: #000; margin-top: 10px; }
    .btn-pdf { background: var(--success); color: #fff; font-size: 1.05rem; padding: 15px; margin-top: 12px; }

    /* Lista esercizi inseriti */
    .exercise-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 380px; overflow-y: auto; }
    .exercise-item { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .item-img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; }
    .item-details { flex: 1; font-size: 0.85rem; }
    .item-details strong { font-size: 0.9rem; display: block; margin-bottom: 2px; }
    .item-sub { color: var(--text-muted); font-size: 0.75rem; }
    .btn-del { background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; padding: 6px; }

    /* TEMPLATE NASCOSTO FORMATTATO PER IL PDF */
    #pdfPreviewWrapper { display: none; }
    .pdf-sheet { background: #ffffff; color: #1e293b; padding: 25px; width: 800px; font-size: 12px; }
    .pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0284c7; padding-bottom: 10px; margin-bottom: 12px; }
    .pdf-header-left { display: flex; align-items: center; gap: 14px; }
    .pdf-logo { height: 50px; width: auto; max-width: 130px; object-fit: contain; }
    .pdf-header h2 { font-size: 20px; color: #0284c7; line-height: 1.1; }
    .pdf-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 11px; }
    .pdf-table { width: 100%; border-collapse: collapse; }
    .pdf-table th { background: #0284c7; color: #fff; text-align: left; padding: 7px 6px; font-size: 10px; text-transform: uppercase; }
    .pdf-table td { padding: 8px 6px; border-bottom: 1px solid #cbd5e1; vertical-align: middle; }
    .pdf-table tr:nth-child(even) { background: #f8fafc; }
    .pdf-img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; border: 1px solid #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-brand">
        <img src="logo_carlo.png" alt="Logo" class="site-logo">
        <h1>Scheda Palestra</h1>
      </div>
      <span style="font-size: 0.8rem; color: var(--text-muted);" id="dbCount">0 Esercizi nel DB</span>
    </header>

    <!-- 1. Dati Scheda -->
    <div class="card">
      <div class="section-title">1. Informazioni Scheda</div>
      <div class="grid-2">
        <div class="field">
          <label>Nome Atleta</label>
          <input type="text" id="athleteName" placeholder="es. Mario Rossi">
        </div>
        <div class="field">
          <label>Giorno / Split</label>
          <input type="text" id="daySplit" placeholder="es. Giorno A - Spinta">
        </div>
        <div class="field">
          <label>Obiettivo</label>
          <input type="text" id="goal" placeholder="es. Ipertrofia / Forza">
        </div>
        <div class="field">
          <label>Durata (settimane)</label>
          <input type="text" id="duration" placeholder="es. 6 settimane">
        </div>
      </div>
    </div>

    <!-- 2. Scelta e Parametri Esercizio -->
    <div class="card">
      <div class="section-title">2. Aggiungi Esercizio</div>
      
      <!-- Filtro muscolo + Ricerca -->
      <div class="filter-row">
        <select id="muscleFilter" style="max-width: 130px;">
          <option value="ALL">Tutti</option>
          <option value="Petto">Petto</option>
          <option value="Dorso">Dorso</option>
          <option value="Gambe">Gambe</option>
          <option value="Spalle">Spalle</option>
          <option value="Braccia">Braccia</option>
        </select>
        <select id="exerciseSelect"></select>
      </div>

      <!-- Anteprima visiva dell'esercizio selezionato -->
      <div class="preview-box">
        <img id="previewImg" class="preview-thumb" src="" alt="Anteprima">
        <div class="preview-info">
          <strong id="previewName">-</strong><br>
          <span style="color: var(--primary);" id="previewMuscle">-</span>
        </div>
      </div>

      <!-- Campi compilabili a mano -->
      <div class="grid-4">
        <div class="field">
          <label>Serie</label>
          <input type="text" id="inSets" placeholder="4">
        </div>
        <div class="field">
          <label>Reps</label>
          <input type="text" id="inReps" placeholder="8-10">
        </div>
        <div class="field">
          <label>Recup.</label>
          <input type="text" id="inRest" placeholder="90''">
        </div>
        <div class="field">
          <label>Carico</label>
          <input type="text" id="inLoad" placeholder="RPE 8">
        </div>
      </div>

      <div class="field" style="margin-top: 8px;">
        <label>Note Esecuzione / Spiegazione</label>
        <input type="text" id="inNotes" placeholder="es. Fermo 1s in basso, discesa controllata 3s">
      </div>

      <button class="btn btn-add" id="btnAddEx">➕ Inserisci nella Scheda</button>
    </div>

    <!-- 3. Riepilogo ed esportazione PDF -->
    <div class="card">
      <div class="section-title">
        <span>3. Esercizi della Scheda</span>
        <span id="counterLabel" style="color: var(--text-muted); font-size: 0.85rem;">0 inseriti</span>
      </div>

      <div class="exercise-list" id="exerciseList">
        <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 12px;">Nessun esercizio aggiunto</div>
      </div>

      <button class="btn btn-pdf" id="btnPdf">📄 Scarica PDF Stampabile</button>
    </div>
  </div>

  <!-- Area Invisibile per Rendering PDF -->
  <div id="pdfPreviewWrapper">
    <div id="pdfSheet" class="pdf-sheet">
      <div class="pdf-header">
        <div class="pdf-header-left">
          <img src="logo_carlo.png" alt="Logo" class="pdf-logo">
          <div>
            <h2>SCHEDA DI ALLENAMENTO</h2>
            <div style="font-weight: 700; color: #475569;" id="pdfSplit">-</div>
          </div>
        </div>
        <div style="text-align: right; font-size: 11px; color: #64748b;">
          Data: <span id="pdfDate"></span>
        </div>
      </div>

      <div class="pdf-meta">
        <div><strong>Atleta:</strong> <span id="pdfAthlete">-</span></div>
        <div><strong>Fase:</strong> <span id="pdfGoal">-</span></div>
        <div><strong>Durata:</strong> <span id="pdfDuration">-</span></div>
        <div><strong>Tot Esercizi:</strong> <span id="pdfCount">0</span></div>
      </div>

      <table class="pdf-table">
        <thead>
          <tr>
            <th style="width: 60px;">Img</th>
            <th>Esercizio</th>
            <th style="width: 50px; text-align: center;">Serie</th>
            <th style="width: 70px;">Reps</th>
            <th style="width: 60px;">Rec.</th>
            <th style="width: 80px;">Carico</th>
            <th>Note Tecniche</th>
          </tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let currentWorkout = [];

    const muscleFilter = document.getElementById("muscleFilter");
    const exerciseSelect = document.getElementById("exerciseSelect");
    const previewImg = document.getElementById("previewImg");
    const previewName = document.getElementById("previewName");
    const previewMuscle = document.getElementById("previewMuscle");

    document.getElementById("dbCount").textContent = `${EXERCISE_DB.length} Esercizi nel DB`;

    function populateSelect() {
      const filter = muscleFilter.value;
      exerciseSelect.innerHTML = "";

      const filtered = EXERCISE_DB.filter(ex => filter === "ALL" || ex.muscle === filter);

      filtered.forEach(ex => {
        const opt = document.createElement("option");
        opt.value = ex.id;
        opt.textContent = `[${ex.muscle}] ${ex.name}`;
        exerciseSelect.appendChild(opt);
      });

      updatePreview();
    }

    function updatePreview() {
      const selected = EXERCISE_DB.find(e => e.id === exerciseSelect.value);
      if (selected) {
        previewImg.src = selected.img;
        previewName.textContent = selected.name;
        previewMuscle.textContent = selected.muscle;
      }
    }

    muscleFilter.addEventListener("change", populateSelect);
    exerciseSelect.addEventListener("change", updatePreview);
    populateSelect();

    document.getElementById("btnAddEx").addEventListener("click", () => {
      const selected = EXERCISE_DB.find(e => e.id === exerciseSelect.value);
      if (!selected) return;

      const sets = document.getElementById("inSets").value.trim() || "-";
      const reps = document.getElementById("inReps").value.trim() || "-";
      const rest = document.getElementById("inRest").value.trim() || "-";
      const load = document.getElementById("inLoad").value.trim() || "-";
      const notes = document.getElementById("inNotes").value.trim() || "-";

      currentWorkout.push({
        uid: Date.now(),
        name: selected.name,
        muscle: selected.muscle,
        img: selected.img,
        sets, reps, rest, load, notes
      });

      document.getElementById("inNotes").value = "";
      renderList();
    });

    function renderList() {
      const list = document.getElementById("exerciseList");
      list.innerHTML = "";
      document.getElementById("counterLabel").textContent = `${currentWorkout.length} inseriti`;

      if (currentWorkout.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 12px;">Nessun esercizio aggiunto</div>`;
        return;
      }

      currentWorkout.forEach((ex, idx) => {
        const item = document.createElement("div");
        item.className = "exercise-item";
        item.innerHTML = `
          <img src="${ex.img}" class="item-img" alt="${ex.name}">
          <div class="item-details">
            <strong>${idx + 1}. ${ex.name}</strong>
            <div class="item-sub">${ex.sets} Serie × ${ex.reps} | Rec: ${ex.rest} | ${ex.load}</div>
            ${ex.notes !== '-' ? `<div class="item-sub" style="color: var(--primary);">Note: ${ex.notes}</div>` : ''}
          </div>
          <button class="btn-del" onclick="deleteEx(${ex.uid})">✖</button>
        `;
        list.appendChild(item);
      });
    }

    window.deleteEx = function(uid) {
      currentWorkout = currentWorkout.filter(e => e.uid !== uid);
      renderList();
    };

    document.getElementById("btnPdf").addEventListener("click", () => {
      if (currentWorkout.length === 0) {
        alert("Aggiungi almeno un esercizio prima di scaricare il PDF.");
        return;
      }

      const athlete = document.getElementById("athleteName").value.trim() || "Atleta";
      const split = document.getElementById("daySplit").value.trim() || "Allenamento";
      const goal = document.getElementById("goal").value.trim() || "-";
      const duration = document.getElementById("duration").value.trim() || "-";

      document.getElementById("pdfAthlete").textContent = athlete;
      document.getElementById("pdfSplit").textContent = split;
      document.getElementById("pdfGoal").textContent = goal;
      document.getElementById("pdfDuration").textContent = duration;
      document.getElementById("pdfCount").textContent = currentWorkout.length;
      document.getElementById("pdfDate").textContent = new Date().toLocaleDateString("it-IT");

      const tbody = document.getElementById("pdfTableBody");
      tbody.innerHTML = "";

      currentWorkout.forEach((ex, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img src="${ex.img}" class="pdf-img" crossorigin="anonymous"></td>
          <td><strong>${i + 1}. ${ex.name}</strong><br><small style="color: #64748b;">${ex.muscle}</small></td>
          <td style="text-align: center; font-weight: bold;">${ex.sets}</td>
          <td>${ex.reps}</td>
          <td>${ex.rest}</td>
          <td>${ex.load}</td>
          <td style="font-size: 10px; color: #334155;">${ex.notes}</td>
        `;
        tbody.appendChild(tr);
      });

      const element = document.getElementById("pdfSheet");
      const wrapper = document.getElementById("pdfPreviewWrapper");
      wrapper.style.display = "block";

      const opt = {
        margin:       8,
        filename:     `Scheda_${athlete.replace(/\s+/g, '_')}_${split.replace(/\s+/g, '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        wrapper.style.display = "none";
      });
    });
  </script>
</body>
</html>
